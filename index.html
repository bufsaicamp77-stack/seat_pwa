<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강의실 좌석 예약·출석</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5d5e60">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="좌석예약">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 역할 전환 바 → 기준 시각 바 → 교시 카드 → I423호 좌석도(교탁이 위) + 오른쪽 작업 패널, 좁은 화면에서는 세로로 쌓임 */
:root {
  /* 학교 심볼 색: 차콜 그레이 + 옐로 */
  --bg: #f4f4f2;
  --surface: #ffffff;
  --sunk: #ebebe8;
  --ink: #2a2b2d;
  --muted: #66676a;
  --line: #d6d6d2;
  --accent: #58595b;
  --accent-soft: #fff3c4;
  --brand: #ffc20e;
  --brand-ink: #2a2b2d;
  --brand-text: #8a6400;
  --head: #5d5e60;
  --head-ink: #f2f2f0;
  --ok: #2e7a4c;
  --ok-soft: #dcefe2;
  --bad: #b8402f;
  --bad-soft: #f7e0db;
  --warn: #a8700f;
  --warn-soft: #fbedc9;
  --late: #7b3fb0;
  --late-soft: #efe3f8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --seat: clamp(34px, 8.6vw, 62px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18181a; --surface: #222224; --sunk: #2b2b2e; --ink: #ececea; --muted: #a3a4a6; --line: #3a3a3d;
    --accent: #c9cacc; --accent-soft: #3d3418; --brand: #ffc20e; --brand-ink: #1c1c1e; --brand-text: #ffcf47; --head: #2f3032; --head-ink: #f2f2f0; --ok: #79c795; --ok-soft: #1f3a2a; --bad: #ee8b7b; --bad-soft: #432520;
    --warn: #e9b955; --warn-soft: #3f321a; --late: #c79bf0; --late-soft: #33243f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18181a; --surface: #222224; --sunk: #2b2b2e; --ink: #ececea; --muted: #a3a4a6; --line: #3a3a3d;
  --accent: #c9cacc; --accent-soft: #3d3418; --brand: #ffc20e; --brand-ink: #1c1c1e; --brand-text: #ffcf47; --head: #2f3032; --head-ink: #f2f2f0; --ok: #79c795; --ok-soft: #1f3a2a; --bad: #ee8b7b; --bad-soft: #432520;
  --warn: #e9b955; --warn-soft: #3f321a; --late: #c79bf0; --late-soft: #33243f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); border-bottom: 4px solid var(--brand); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--brand); }
.brand span { color: var(--head-ink); opacity: .85; font-size: 13px; }
.top .seg { background: rgba(0,0,0,.22); }
.top .seg button { color: var(--head-ink); }
.top .seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
.lead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.lead h2 { font-size: 22px; font-weight: 700; }
.lead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.clock { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.clock b { font-family: var(--font-mono); font-size: 18px; font-weight: 600; }
.clock .now { color: var(--muted); }
.clock label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-left: auto; }
.clock input { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; font-family: var(--font-mono); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }

.room { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.room-head { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.room-head .meta { color: var(--muted); font-size: 13px; }
.map-scroll { overflow-x: auto; padding-bottom: 4px; }
.map { display: grid; grid-template-columns: 18px repeat(4, var(--seat)) 22px repeat(4, var(--seat)); gap: 6px; justify-content: center; min-width: max-content; margin: 0 auto; }
.board { grid-column: 2 / -1; text-align: center; font-size: 12px; letter-spacing: .1em; color: var(--muted); border: 1px solid var(--line); background: var(--sunk); border-radius: 4px; padding: 4px; margin-bottom: 10px; }
.rowlab { align-self: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: center; }

.seat { position: relative; height: calc(var(--seat) * 0.92); border: 1px solid var(--line); background: var(--surface); border-radius: 7px 7px 3px 3px; padding: 3px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; line-height: 1.2; overflow: hidden; transition: transform .08s, opacity .15s; }
.seat:hover { transform: translateY(-1px); }
.map { user-select: none; -webkit-user-select: none; }
.seat .code { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.seat .nm { font-weight: 600; font-size: 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.seat.free { background: var(--surface); }
.seat.taken { background: var(--sunk); color: var(--muted); cursor: not-allowed; }
.seat.mine { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.seat.mine .code { color: var(--brand-ink); }
.seat.pick { box-shadow: 0 0 0 2px var(--accent); }
.seat.locked.free { cursor: not-allowed; }
.seat.empty { border-style: dashed; background: transparent; color: var(--muted); }
.seat.st-in { background: var(--ok-soft); border-color: var(--ok); }
.seat.st-out { background: var(--bad-soft); border-color: var(--bad); }
.seat.suspect { box-shadow: 0 0 0 2px var(--warn); }
.seat.late { border: 2px solid var(--late); padding-top: 12px; }
.seat .late-badge { position: absolute; top: 0; left: 0; right: 0; background: var(--late); color: var(--surface); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; line-height: 12px; text-align: center; }
.tag.late { background: var(--late); color: var(--surface); font-weight: 600; }
.stat.late b { color: var(--late); }
.openbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.openbar.on { border-color: var(--ok); background: var(--ok-soft); }
.who { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--head-ink); }
.who:empty { display: none; }
.who .btn { padding: 5px 10px; font-size: 13px; }
.login .seg { justify-self: start; }

.esync { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
.esync.off { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; border-left-color: var(--line); color: var(--muted); }
.esync-head { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: start; }
.esync .sub, .alimtalk .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.esync-row { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
.esync-k { font-weight: 600; }
.esync-v { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
@media (max-width: 560px) { .esync-row { grid-template-columns: 1fr; } }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pill.live { background: var(--brand); color: var(--brand-ink); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.code-sm { font-size: 18px; letter-spacing: .12em; }
.codescreen { position: fixed; inset: 0; z-index: 20; background: var(--head); color: var(--head-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.codescreen .eyebrow { color: var(--brand); font-size: 16px; }
.codescreen .bigcode { font-size: clamp(72px, 22vw, 200px); font-weight: 600; letter-spacing: .14em; color: var(--brand); line-height: 1; }
.codescreen p { margin: 0; font-size: 18px; }
.alimtalk { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--brand); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.alimtalk .sub, .alimtalk .hint { color: var(--muted); }
.alimtalk input { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 12px; width: 100%; max-width: 200px; letter-spacing: .2em; }
.alimtalk.done { background: var(--ok-soft); color: var(--ink); box-shadow: none; border: 1px solid var(--ok); }
.dots { display: flex; gap: 3px; margin-top: 1px; }
.dots i { width: 13px; height: 12px; border-radius: 3px; background: var(--line); color: var(--muted); font-style: normal; font-size: 8.5px; font-weight: 700; line-height: 12px; text-align: center; }
.dots i.in { background: var(--ok); color: var(--surface); }
.dots i.out { background: var(--bad); color: var(--surface); }
.stat b small { font-size: 14px; color: var(--bad); }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.howto dt { font-weight: 600; }
.howto dd { margin: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { font-size: 17px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 0; }
.panel hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.rounds { display: grid; gap: 8px; }
.round { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; font-size: 14px; }
.tri { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tri button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; border-right: 1px solid var(--line); }
.tri button:last-child { border-right: 0; }
.tri button[aria-pressed="true"].in { background: var(--ok); color: var(--surface); }
.tri button[aria-pressed="true"].out { background: var(--bad); color: var(--surface); }
.tri button[aria-pressed="true"].none { background: var(--sunk); }

.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 10px 14px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--warn); }
.stat.bad b { color: var(--bad); }
.stat.ok b { color: var(--ok); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.periods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.period { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; gap: 1px; }
.period[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); background: var(--accent-soft); }
.period b { font-size: 15px; }
.period small { color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.period .st { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.period .st.open { color: var(--ok); font-weight: 600; }
.period .st.yes { color: var(--brand-text); font-weight: 600; }

.login { max-width: 440px; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
.login h2 { font-size: 20px; }
.login p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; width: 100%; }
.err { color: var(--bad); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint button { border: 0; background: none; padding: 0; color: var(--brand-text); text-decoration: underline; font-family: var(--font-mono); font-size: 12.5px; }
.note { font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 10px 12px; margin: 0; }
.note.warn { background: var(--warn-soft); color: var(--ink); }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; max-height: 220px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.log time { font-family: var(--font-mono); color: var(--muted); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
td.mono { font-size: 13px; }
.tbl { overflow-x: auto; max-height: 420px; overflow-y: auto; }

.foot { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .seat { transition: none; } .seat:hover { transform: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>강의실 좌석 예약·출석</h1><span>I423호 좌석 예약 · 출석 확인 시제품</span></div>
    <div class="seg" role="group" aria-label="사용자 역할">
      <button type="button" data-role="student">학생</button>
      <button type="button" data-role="prof">교수</button>
      <button type="button" data-role="admin">관리자</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
const APP_VERSION = "v4"; // sw.js의 VERSION과 같이 올림. 화면 맨 아래에 표시되어 어느 버전인지 확인할 수 있음
const ROOM = "I423호";
const ROWS = ["A","B","C","D","E","F"];
const COLS = [1,2,3,4,5,6,7,8];
const ROUNDS = [["start","시작"],["end","마감"]];
// 1교시 09:00–09:50 … 10교시 18:00–18:50, 교시마다 10분 쉬는 시간
const PERIODS = Array.from({ length: 10 }, (_, i) => ({ n: i + 1, start: (9 + i) * 60, end: (9 + i) * 60 + 50 }));
const OPEN_BEFORE = 30; // 수업 시작 30분 전부터 예약 가능 (1교시 08:30, 2교시 09:30 …)

const NAMES = ["김서연","이도윤","박하은","최준우","정지아","강민준","조수아","윤시우","장예린","임주원","한서준","오채원","서지호","신유나","권현우","황다인","안건우","송가은","류태윤","전하린","홍승민","고나연","문재희","양서진","손도현","배지민","백선우","허윤서","남궁민","노은채"];
const DEPTS = ["컴퓨터공학과","소프트웨어학과","전자공학과","산업공학과","경영학과"];

const pad = n => String(n).padStart(2, "0");
const hm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const period = n => PERIODS[n - 1];
const plabel = n => `${n}교시`;
const ptime = n => `${hm(period(n).start)}–${hm(period(n).end)}`;
const openAt = n => period(n).start - OPEN_BEFORE;

function seedStudents() {
  return NAMES.map((name, i) => {
    const year = i === 0 ? "2023" : ["2021","2022","2023","2024"][i % 4];
    const id = i === 0 ? "20231047" : year + String(1000 + ((i * 137) % 900) + 11).padStart(4, "0");
    return { id, name, dept: DEPTS[i % DEPTS.length], consent: i !== 27 };
  });
}
function seed() {
  const students = seedStudents();
  const ids = students.map(s => s.id);
  const res = {}, checks = {}, notes = {}, log = {};
  PERIODS.forEach(p => { res[p.n] = {}; checks[p.n] = { start: {}, end: {} }; notes[p.n] = {}; log[p.n] = []; });
  const s1 = ["A1","A2","A3","A6","A8","B1","B4","B5","B8","C1","C2","C4","C7","C8","D1","D5","D6","D8","E3","E8","F1","F7"];
  s1.forEach((seat, i) => { res[2][seat] = ids[i + 1]; });
  ["A3","B5"].forEach(s => checks[2].start[s] = "out");
  s1.filter(s => !["A3","B5"].includes(s)).forEach(s => checks[2].start[s] = "in");
  ["A1","A2","A6","A8","B1","B4","B8","C1","C2","C4"].forEach(s => checks[2].end[s] = "in");
  checks[2].end["F7"] = "out";

/* ---------- 전자출결 자동 연동 (시연) ----------
   실제 서비스에서는 학교 전자출결 API에 출결 시작을 요청하고 결과를 받아옵니다.
   여기서는 정해진 시각에 세션을 열고, 예시 학생들의 코드 입력을 흉내 냅니다. */
const WIN = 5; // 코드 입력 가능 시간(분)
const autoAt = (p, k) => k === "start" ? period(p).start : period(p).end; // 1교시: 09:00, 09:50
const sess = (p, k) => (S.auto[p] || {})[k] || null;
const live = ss => ss && !ss.closed && nowMin() < ss.t0 + WIN;
// 실시간 모드에서는 코드를 교수 전용 문서(secrets)에만 두어 학생 기기에 보이지 않게 함
const codeOf = (p, k) => LIVE ? (((S.secret[p] || {})[k] || {}).code || "····") : (sess(p, k) || {}).code;
function ensureSecret(p, k, t0) {
  const ref = FB.doc(FB.db, "days", DAY, "secrets", String(p));
  FB.runTransaction(FB.db, async tx => {
    const snap = await tx.get(ref);
    if (snap.exists() && snap.data()[k]) return;
    const code = String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000));
    const until = FB.Timestamp.fromMillis(Date.now() + (t0 + WIN - nowMin()) * 60000);
    tx.set(ref, { [k]: { code, until } }, { merge: true });
  }).catch(syncErr);
}
function markDone(p, k, ss, id) {
  ss.done[id] = true;
  const seat = seatOf(p, id);
  if (seat) { if (!S.checks[p][k][seat]) S.checks[p][k][seat] = "in"; }
  else if (!ss.unseated.includes(id)) ss.unseated.push(id);
}
function syncAuto() {
  if (!canWrite() || (FB_MODE && !LIVE)) return;
  (S.codesList || []).forEach(c => {
    const ss = sess(c.p, c.k);
    if (!ss || ss.done[c.sid]) return;
    markDone(c.p, c.k, ss, c.sid);
    const at = c.at && c.at.toDate ? c.at.toDate() : new Date();
    S.log[c.p].push({ t: pad(at.getHours()) + ":" + pad(at.getMinutes()), m: `${student(c.sid).name}: ${roundName(c.k)} 출결 코드 입력` });
  });
  const m = nowMin();
  PERIODS.forEach(({ n: p }) => {
    if (S.autoOff[p]) return;
    ROUNDS.forEach(([k, l]) => {
      const t0 = autoAt(p, k);
      S.auto[p] = S.auto[p] || {};
      let ss = S.auto[p][k];
      if (!ss) {
        if (m < t0 || m >= t0 + WIN) return;
        // 코드와 예시 응답은 날짜·교시로 정해지는 값이라, 여러 기기가 동시에 열어도 같은 결과가 됩니다
        const seedKey = DAY + "|" + p + "|" + k;
        ss = S.auto[p][k] = { t0, delays: {}, done: {}, unseated: [], closed: false };
        if (LIVE) ensureSecret(p, k, t0); else ss.code = String(1000 + Math.floor(hash01(seedKey + "|code") * 9000));
        if (S.demoReplies !== false) S.students.forEach(s => {
          if (s.id === TEST_ID) return; // 시험용 학생은 직접 입력
          const r = hash01(seedKey + "|" + s.id);
          if (seatOf(p, s.id) ? r < 0.88 : r < 0.07) ss.delays[s.id] = Math.floor(hash01(seedKey + "|d|" + s.id) * WIN);
        });
        S.log[p].push({ t: hm(t0), m: `${l} 출결 자동 시작 · 수강생 ${S.students.length}명에게 알림톡 발송` });
      }
      if (ss.closed) return;
      const el = m - ss.t0;
      Object.entries(ss.delays).forEach(([id, d]) => { if (!ss.done[id] && d <= el) markDone(p, k, ss, id); });
      if (el >= WIN) {
        const miss = Object.keys(S.res[p]).filter(seat => !ss.done[S.res[p][seat]] && !S.checks[p][k][seat]);
        miss.forEach(seat => S.checks[p][k][seat] = "out");
        ss.closed = true;
        S.log[p].push({ t: hm(ss.t0 + WIN), m: `${l} 출결 자동 마감: 코드 입력 ${Object.keys(ss.done).length}명, 예약했지만 미입력 ${miss.length}명${miss.length ? " (" + miss.join(", ") + ")" : ""}` });
        if (S.showCode && S.showCode.p === p && S.showCode.k === k) S.showCode = null;
      }
    });
  });
}
function autoBar(p) {
  if (S.autoOff[p]) return `<div class="esync off"><div><b>전자출결 자동 연동 꺼짐</b> · ${plabel(p)}은 휴강·보강 등으로 자동 출결을 보내지 않습니다.</div><button class="btn" type="button" data-act="autoOn">다시 켜기</button></div>`;
  const m = nowMin();
  const rows = ROUNDS.map(([k, l]) => {

      <button class="btn quiet" type="button" data-act="autoOff">이 교시 자동 출결 끄기 (휴강)</button></div>
    ${rows}
    ${unseated.length ? `<p class="note warn">코드는 입력했지만 좌석 예약이 없는 학생 ${unseated.length}명: ${unseated.map(id => esc(student(id).name)).join(", ")}. 빈 좌석을 눌러 현장 배정하세요.</p>` : ""}
  </div>`;
}

/* ---------- 교수 ---------- */
function statusOf(p, round, seat) { return S.checks[p][round][seat] || null; }
function isSuspect(p, seat) {
  const ch = S.checks[p];
  return ch.start[seat] === "in" && ch.end[seat] === "out";
}
function periodSelect(id, cur) {
  return `<select id="${id}" aria-label="교시 선택" style="width:auto">${PERIODS.map(x => `<option value="${x.n}" ${x.n === cur ? "selected" : ""}>${plabel(x.n)} (${ptime(x.n)}) · 예약 ${Object.keys(S.res[x.n]).length}명</option>`).join("")}</select>`;
}
function openBar(p) {
  const ts = timeState(p);
  if (forced(p)) return `<div class="openbar on"><span><b>${plabel(p)} 학생 예약을 열어 두었습니다.</b> 닫기 전까지 학생이 좌석을 예약하거나 바꿀 수 있습니다.</span><button class="btn" type="button" data-act="closeBook">예약 닫기</button></div>`;
  if (ts === "open") return `<div class="openbar"><span>지금은 ${plabel(p)} 예약 시간입니다 (${hm(openAt(p))}–${hm(period(p).start)}).</span></div>`;
  return `<div class="openbar"><span>${plabel(p)} 학생 예약 ${ts === "closed" ? "마감" : "전"} · 기본 예약 시간 ${hm(openAt(p))}–${hm(period(p).start)}</span><button class="btn primary" type="button" data-act="openBook">학생 예약 열기</button></div>`;
}
// 일괄 착석 대상: 시작 확인이 덜 끝났으면 시작, 아니면 마감
function fillRound(p) {
  const seats = Object.keys(S.res[p]);
  if (seats.some(s => !statusOf(p, "start", s))) return "start";
  if (seats.some(s => !statusOf(p, "end", s))) return "end";
  return null;
}
// 클릭(착석)·우클릭(빈자리): 시작 기록 → 마감 기록 → 초기화
function cycleCheck(p, seat, v) {
  const ch = S.checks[p], n = student(S.res[p][seat]).name, word = v === "in" ? "착석" : "빈자리";
  if (!ch.start[seat]) { ch.start[seat] = v; addLog(p, `${seat} ${n}: 시작 확인 ${word}`); }
  else if (!ch.end[seat]) { ch.end[seat] = v; addLog(p, `${seat} ${n}: 마감 확인 ${word}`); }
  else { delete ch.start[seat]; delete ch.end[seat]; addLog(p, `${seat} ${n}: 확인 기록 초기화`); }
}
function toggleNote(p, id, note) {
  const arr = S.notes[p][id] || [], on = !arr.includes(note);
  S.notes[p][id] = on ? [...arr, note] : arr.filter(x => x !== note);
  addLog(p, `${student(id).name}: ${note} ${on ? "표시" : "해제"}`);
  toast(`${student(id).name}: ${note} ${on ? "표시" : "해제"}`);
}
function renderProf() {

  const susp = seats.filter(s => isSuspect(p, s));
  const isLate = id => (S.notes[p][id] || []).includes("지각");
  const lateSeats = seats.filter(s => isLate(res[s]));
  const noSeat = S.students.map(s => s.id).filter(id => !seatOf(p, id));
  const map = mapShell(seat => {

    const st = statusOf(p, "end", seat) || statusOf(p, "start", seat);
    const n = student(who).name;
    const word = v => v === "in" ? "착석" : v === "out" ? "빈자리" : "미확인";
    const dots = ROUNDS.map(([k, l]) => `<i class="${statusOf(p, k, seat) || ""}">${l[0]}</i>`).join("");
    const late = isLate(who);
    return `<button type="button" class="seat ${st ? "st-" + st : ""} ${isSuspect(p, seat) ? "suspect" : ""} ${late ? "late" : ""} ${S.profPick === seat ? "pick" : ""}" data-pseat="${seat}" aria-label="${seat} ${n} 시작 ${word(statusOf(p, "start", seat))}, 마감 ${word(statusOf(p, "end", seat))}${late ? ", 지각" : ""}">

      <div class="field"><label for="moveTo">자리 이동</label>

  } else if (pk) {

      ${noSeat.length ? `<div class="field"><label for="assignWho">이 교시 좌석 미예약 학생 ${noSeat.length}명</label>
        <select id="assignWho">${noSeat.map(id => `<option value="${id}">${esc(student(id).name)} · ${id}</option>`).join("")}</select></div>
        <p class="sub">배정하면 이 좌석에 앉은 것으로 시작 확인이 기록됩니다.</p>

  } else {
    panel = `<div><div class="eyebrow">사용 방법</div><h3>${S.quick ? "클릭으로 출석 체크" : "좌석을 눌러 자세히 보기"}</h3></div>

/* ---------- Firebase 실시간 저장 ----------
   days/{날짜}/periods/{교시}: 출석·지각·기록 등 (교수·관리자만 수정)
   days/{날짜}/res/{교시_좌석}, mine/{교시_학번}: 좌석 예약 (학생은 자기 것만, 보안 규칙이 검사)
   days/{날짜}/secrets/{교시}: 출결 코드 (교수·관리자만 읽기)
   days/{날짜}/codes/{교시_시점_학번}: 학생이 낸 코드 (보안 규칙이 정답·시간을 검사)
   roster/{학번}, staff/{이메일}, config/main */
const known = {}, synced = {};
let syncedRes = {}, unsubs = [];
const clone = o => JSON.parse(JSON.stringify(o));
const emptyPeriod = () => ({ checks: { start: {}, end: {} }, notes: {}, log: [], forceOpen: false, autoOff: false, auto: {} });
const pref = n => FB.doc(FB.db, "days", DAY, "periods", String(n));
const resRef = (p, seat) => FB.doc(FB.db, "days", DAY, "res", p + "_" + seat);
const mineRef = (p, sid) => FB.doc(FB.db, "days", DAY, "mine", p + "_" + sid);
const periodData = n => ({ checks: S.checks[n], notes: S.notes[n], log: S.log[n], forceOpen: !!S.forceOpen[n], autoOff: !!S.autoOff[n], auto: S.auto[n] || {} });
function syncErr(e) { console.error(e); toast(e && e.code === "permission-denied" ? "권한이 없습니다. 로그인 상태나 보안 규칙을 확인하세요." : "저장소 오류: " + (e && (e.code || e.message) || e)); }
function flat(o, pre, out) {
  for (const [k, v] of Object.entries(o || {})) {
    const path = pre ? pre + "." + k : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flat(v, path, out); else out[path] = v;
  }
  return out;
}
function applyPeriod(n, d) {
  S.checks[n] = { start: (d.checks || {}).start || {}, end: (d.checks || {}).end || {} };
  S.notes[n] = d.notes || {};
  S.log[n] = d.log || [];
  if (d.forceOpen) S.forceOpen[n] = true; else delete S.forceOpen[n];
  if (d.autoOff) S.autoOff[n] = true; else delete S.autoOff[n];
  S.auto[n] = d.auto || {};
  synced[n] = clone(periodData(n));
}
function pushChanges() {
  if (!LIVE || !isStaffUser()) return;
  PERIODS.forEach(({ n }) => {
    const cur = clone(periodData(n));
    if (!known[n]) {
      if (JSON.stringify(cur) === JSON.stringify(emptyPeriod())) return;
      known[n] = true; synced[n] = cur;
      FB.setDoc(pref(n), cur).catch(syncErr);
      return;
    }
    const prev = synced[n] || emptyPeriod();
    const a = flat({ ...prev, log: null }, "", {}), b = flat({ ...cur, log: null }, "", {});
    const up = {};
    for (const k in b) if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) up[k] = b[k];
    for (const k in a) if (!(k in b)) up[k] = FB.deleteField();
    const seen = new Set((prev.log || []).map(x => JSON.stringify(x)));
    const added = (cur.log || []).filter(x => !seen.has(JSON.stringify(x)));
    if (added.length) up.log = FB.arrayUnion(...added);
    if (!Object.keys(up).length) return;
    synced[n] = cur;
    FB.updateDoc(pref(n), up).catch(syncErr);
  });
  pushRes();
}
// 교수·관리자가 바꾼 좌석 배정(현장 배정, 이동, 해제, 예시 채우기)을 예약 문서로 반영
function pushRes() {
  const batch = FB.writeBatch(FB.db);
  let ops = 0;
  PERIODS.forEach(({ n: p }) => {
    const a = syncedRes[p] || {}, b = S.res[p] || {};
    for (const seat in a) if (b[seat] !== a[seat]) {
      batch.delete(resRef(p, seat)); ops++;
      if (!Object.values(b).includes(a[seat])) { batch.delete(mineRef(p, a[seat])); ops++; }
    }
    for (const seat in b) if (a[seat] !== b[seat]) {
      batch.set(resRef(p, seat), { p, seat, sid: b[seat] });
      batch.set(mineRef(p, b[seat]), { p, seat, sid: b[seat] }); ops += 2;
    }
  });
  if (!ops) return;
  syncedRes = clone(S.res);
  batch.commit().catch(syncErr);
}
// 학생 본인 예약·변경·취소: 보안 규칙이 "빈자리인지, 본인 것인지"를 서버에서 확인
function studentReserve(p, seat) {
  const sid = S.me, old = seatOf(p, sid), batch = FB.writeBatch(FB.db);
  if (old) batch.delete(resRef(p, old));
  batch.set(resRef(p, seat), { p, seat, sid });
  batch.set(mineRef(p, sid), { p, seat, sid });
  // 거절 이유가 둘: 다른 학생이 먼저 잡았거나, 서버 시각 기준 예약 시간이 아님
  return batch.commit().then(() => ({ old }), e => {
    if (e.code !== "permission-denied") throw e;
    return FB.getDoc(resRef(p, seat)).then(s => s.exists() && s.data().sid !== sid ? { taken: true } : { closed: true });
  });
}
function studentCancel(p) {
  const sid = S.me, old = seatOf(p, sid), batch = FB.writeBatch(FB.db);
  batch.delete(resRef(p, old));
  batch.delete(mineRef(p, sid));
  return batch.commit().then(() => old, e => { if (e.code === "permission-denied") e.closed = true; throw e; });
}
const CLOSED_MSG = p => `${plabel(p)} 예약 가능 시간이 아닙니다. (서버 시각 기준, 교수님이 예약을 열면 다시 할 수 있어요)`;
function writeAllPeriods() {
  PERIODS.forEach(({ n }) => { const cur = clone(periodData(n)); known[n] = true; synced[n] = cur; FB.setDoc(pref(n), cur).catch(syncErr); });
  pushRes();
}
function stopSync() { unsubs.forEach(u => u()); unsubs = []; LIVE = false; }
function startSync() {
  stopSync();
  const rerender = () => { if (!document.querySelector("input:focus, select:focus")) render(); };
  let gotPeriods = false, gotRes = false;
  const ready = () => { if (gotPeriods && gotRes && !LIVE) { LIVE = true; } if (LIVE) rerender(); };
  unsubs.push(FB.onSnapshot(FB.collection(FB.db, "days", DAY, "periods"), snap => {
    if (!gotPeriods) { gotPeriods = true; PERIODS.forEach(({ n }) => { known[n] = false; applyPeriod(n, emptyPeriod()); }); }
    snap.docChanges().forEach(ch => {
      const n = +ch.doc.id;
      if (!period(n)) return;
      if (ch.type === "removed") { known[n] = false; applyPeriod(n, emptyPeriod()); }
      else { known[n] = true; applyPeriod(n, ch.doc.data()); }
    });
    ready();
  }, syncErr));
  unsubs.push(FB.onSnapshot(FB.collection(FB.db, "days", DAY, "res"), snap => {
    gotRes = true;
    PERIODS.forEach(({ n }) => S.res[n] = {});
    snap.forEach(d => { const r = d.data(); if (period(r.p)) S.res[r.p][r.seat] = r.sid; });
    syncedRes = clone(S.res);
    ready();
  }, syncErr));
  unsubs.push(FB.onSnapshot(FB.collection(FB.db, "roster"), snap => {
    S.students = snap.docs.map(d => ({ id: d.id, name: d.data().name || d.id, dept: d.data().dept || "", consent: d.data().consent !== false })).sort((a, b) => a.id.localeCompare(b.id));
    rerender();
  }, syncErr));
  unsubs.push(FB.onSnapshot(FB.doc(FB.db, "config", "main"), d => {
    S.demoReplies = d.exists() ? d.data().demoReplies !== false : true;
    rerender();
  }, () => {}));
  if (isStaffUser()) {
    unsubs.push(FB.onSnapshot(FB.collection(FB.db, "days", DAY, "secrets"), snap => {
      S.secret = {}; snap.forEach(d => S.secret[d.id] = d.data()); rerender();
    }, syncErr));
    // 학생이 낸 코드(정답만 저장됨) → syncAuto에서 출석으로 반영
    unsubs.push(FB.onSnapshot(FB.collection(FB.db, "days", DAY, "codes"), snap => {
      S.codesList = snap.docs.map(d => d.data()); rerender();
    }, syncErr));
  }
  if (USER && USER.isAdmin) unsubs.push(FB.onSnapshot(FB.collection(FB.db, "staff"), snap => { S.staffList = snap.docs.map(d => d.id); rerender(); }, () => {}));
}
// Firebase 모듈이 불러와지면 호출됨
window.onFirebase = function () {
  FB_MODE = true;
  render();
  FB.onAuthStateChanged(FB.auth, async u => {
    stopSync();
    USER = null;
    if (u) {
      const email = (u.email || "").toLowerCase();
      try {
        if (email === ADMIN_EMAIL) USER = { uid: u.uid, email, kind: "staff", isAdmin: true };
        else if (email.endsWith("@" + STUDENT_DOMAIN)) {
          const sid = email.split("@")[0].split("-")[0];
          if (email !== sidEmail(sid, await curGen(sid))) { await FB.signOut(FB.auth); AUTHED = true; render(); return authError({ message: "비밀번호가 초기화된 계정입니다. '가입하기'에서 새 비밀번호를 만드세요." }); }
          if ((await FB.getDoc(FB.doc(FB.db, "roster", sid))).exists()) USER = { uid: u.uid, email, kind: "student", sid };
          else { await FB.signOut(FB.auth); AUTHED = true; render(); return authError({ message: "명단에 없는 학번입니다. 교수님께 문의하세요." }); }
        } else if ((await FB.getDoc(FB.doc(FB.db, "staff", email))).exists()) USER = { uid: u.uid, email, kind: "staff", isAdmin: false };
        else { await FB.signOut(FB.auth); AUTHED = true; render(); return authError({ message: "등록되지 않은 교수 계정입니다. 관리자에게 등록을 요청하세요." }); }
      } catch (e) { syncErr(e); }
    }
    AUTHED = true;
    S.pick = null; S.profPick = null; S.submitted = {}; S.secret = {};
    if (USER) startSync();
    render();
  });
};

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  const d = el.dataset;
  if (d.authtab) { S.authTab = d.authtab; return render(); }
  if (d.authmode) { S.authMode = d.authmode; return render(); }
  if (d.act === "signout" || (d.act === "logout" && FB_MODE)) { FB.signOut(FB.auth); return; }
  if (d.delsid && isStaffUser()) {
    if (!confirm(`${student(d.delsid).name}(${d.delsid}) 학생을 명단에서 삭제할까요? 이 학번으로는 더 이상 로그인할 수 없습니다.`)) return;
    const b = FB.writeBatch(FB.db);
    b.delete(FB.doc(FB.db, "roster", d.delsid)); b.delete(FB.doc(FB.db, "rosterIds", d.delsid));
    b.commit().catch(syncErr); return;
  }
  if (d.pwreset && isStaffUser()) {
    const s = student(d.pwreset);
    if (!confirm(`${s.name}(${s.id}) 학생의 비밀번호를 초기화할까요?\n예전 비밀번호로는 더 이상 로그인할 수 없고, 학생이 '가입하기'에서 새 비밀번호를 만들어야 합니다.`)) return;
    const ref = FB.doc(FB.db, "pwgen", s.id);
    FB.runTransaction(FB.db, async tx => {
      const snap = await tx.get(ref);
      tx.set(ref, { g: (snap.exists() ? snap.data().g || 0 : 0) + 1 });
    }).then(() => toast(`${s.name} 학생 비밀번호를 초기화했습니다. '가입하기'로 새 비밀번호를 만들라고 안내하세요.`), syncErr);
    return;
  }
  if (d.delstaff && USER && USER.isAdmin) { FB.deleteDoc(FB.doc(FB.db, "staff", d.delstaff)).catch(syncErr); return; }
  if (d.act === "seedRoster" && isStaffUser()) {
    const b = FB.writeBatch(FB.db);
    seedStudents().forEach(s => {
      b.set(FB.doc(FB.db, "roster", s.id), { name: s.name, dept: s.dept, consent: s.consent });
      b.set(FB.doc(FB.db, "rosterIds", s.id), {});
    });
    b.commit().then(() => toast("예시 명단을 등록했습니다."), syncErr); return;
  }
  if (d.role) { S.role = d.role; S.pick = null; S.profPick = null; return render(); }
  if (d.fill) { $("#sid").value = d.fill; return; }
  if (d.period) { S.period = +d.period; S.pick = null; return render(); }
  if (d.sseat) {
    const p = S.period, bs = bookState(p), who = S.res[p][d.sseat];
    if (bs === "before") return toast(`${plabel(p)} 예약은 ${hm(openAt(p))}부터 가능합니다.`);
    if (bs === "closed") return toast(`${plabel(p)} 예약은 마감되었습니다.`);
    if (who && who !== S.me) return toast(`${d.sseat}은(는) 이미 예약된 자리입니다.`);
    S.pick = who === S.me ? null : d.sseat; return render();
  }
  if (d.quick) { S.quick = d.quick === "1"; S.profPick = null; return render(); }
  if (d.pseat) {
    const p = S.profPeriod, seat = d.pseat;
    if (e.shiftKey && S.res[p][seat]) { toggleNote(p, S.res[p][seat], "지각"); return render(); }
    if (S.quick && S.res[p][seat]) { cycleCheck(p, seat, "in"); S.profPick = null; return render(); }
    S.profPick = S.profPick === seat ? null : seat; return render();
  }
  if (d.set) {
    const [k, v] = d.set.split(":"), p = S.profPeriod, seat = S.profPick;
    if (v) S.checks[p][k][seat] = v; else delete S.checks[p][k][seat];
    addLog(p, `${seat} ${student(S.res[p][seat]).name}: ${roundName(k)} 확인 ${v === "in" ? "착석" : v === "out" ? "빈자리" : "미확인으로 되돌림"}`);
    return render();
  }
  if (d.note) {
    toggleNote(S.profPeriod, S.res[S.profPeriod][S.profPick], d.note);
    return render();
  }
  const act = d.act;
  if (!act) return;
  if (act === "openBook") { const p = S.profPeriod; S.forceOpen[p] = true; addLog(p, "학생 좌석 예약을 열었습니다"); toast(`${plabel(p)} 학생 예약을 열었습니다.`); return render(); }
  if (act === "closeBook") { const p = S.profPeriod; delete S.forceOpen[p]; addLog(p, "학생 좌석 예약을 닫았습니다"); toast(`${plabel(p)} 학생 예약을 닫았습니다.`); return render(); }
  if (act === "realTime") { S.sim = ""; S.pick = null; return render(); }
  if (act === "plus") { setSim(hm(Math.min(1439, nowMin() + +d.min))); return render(); }
  if (act === "showCode") { S.showCode = { p: S.profPeriod, k: d.k }; return render(); }
  if (act === "hideCode") { S.showCode = null; return render(); }
  if (act === "autoOff") { const p = S.profPeriod; S.autoOff[p] = true; addLog(p, "전자출결 자동 연동 끔 (휴강)"); return render(); }
  if (act === "autoOn") { const p = S.profPeriod; delete S.autoOff[p]; addLog(p, "전자출결 자동 연동 다시 켬"); return render(); }
  if (act === "logout") { S.me = null; S.pick = null; return render(); }
  if (act === "unpick") { S.pick = null; return render(); }
  if (act === "reserve") {
    const p = S.period;
    if (bookState(p) !== "open") { S.pick = null; toast(`${plabel(p)} 예약 가능 시간이 아닙니다.`); return render(); }
    if (LIVE) {
      const seat = S.pick; S.pick = null; render();
      studentReserve(p, seat).then(r => toast(r.taken ? `${seat}은(는) 방금 다른 학생이 예약했습니다. 다른 자리를 골라 주세요.`
        : r.closed ? CLOSED_MSG(p)
        : r.old && r.old !== seat ? `${plabel(p)}: ${r.old}에서 ${seat}(으)로 변경했습니다.` : `${plabel(p)} ${seat} 좌석을 예약했습니다.`)).catch(syncErr);
      return;
    }
    const old = seatOf(p, S.me);
    if (old) delete S.res[p][old];
    S.res[p][S.pick] = S.me;
    toast(old ? `${plabel(p)}: ${old}에서 ${S.pick}(으)로 변경했습니다.` : `${plabel(p)} ${S.pick} 좌석을 예약했습니다.`);
    S.pick = null; return render();
  }
  if (act === "cancel") {
    const p = S.period, old = seatOf(p, S.me);
    if (bookState(p) !== "open") { toast(`${plabel(p)} 예약 가능 시간이 아닙니다.`); return render(); }
    if (LIVE) { studentCancel(p).then(o => toast(`${plabel(p)} ${o} 예약을 취소했습니다.`), e => e.closed ? toast(CLOSED_MSG(p)) : syncErr(e)); return; }
    delete S.res[p][old]; toast(`${plabel(p)} ${old} 예약을 취소했습니다.`); return render();
  }
  if (act === "fillIn") {
    const p = S.profPeriod, k = d.k;
    const ch = S.checks[p][k];
    const list = Object.keys(S.res[p]).filter(s => !ch[s]);
    list.forEach(s => ch[s] = "in");
    const outs = Object.keys(S.res[p]).filter(s => ch[s] === "out");
    addLog(p, `${roundName(k)} 확인 완료: 착석 ${Object.keys(S.res[p]).length - outs.length}명, 빈자리 ${outs.length}명${outs.length ? " (" + outs.join(", ") + ")" : ""}`);
    toast(`${roundName(k)} 확인: ${list.length}명을 착석 처리했습니다.`); return render();
  }
  if (act === "clearRound") { const p = S.profPeriod; S.checks[p] = { start: {}, end: {} }; addLog(p, "시작·마감 확인 기록을 비우고 다시 시작"); return render(); }
  if (act === "assign") {
    const p = S.profPeriod, id = $("#assignWho").value, seat = S.profPick;
    S.res[p][seat] = id; S.checks[p].start[seat] = "in";
    S.notes[p][id] = [...(S.notes[p][id] || []), "현장 배정"];
    addLog(p, `${seat} ${student(id).name}: 현장 배정, 착석`);
    toast(`${student(id).name} 학생을 ${seat}에 배정했습니다.`); return render();
  }
  if (act === "move") {
    const p = S.profPeriod, from = S.profPick, to = $("#moveTo").value, id = S.res[p][from];
    S.res[p][to] = id; delete S.res[p][from];
    ROUNDS.forEach(([k]) => { if (S.checks[p][k][from]) { S.checks[p][k][to] = S.checks[p][k][from]; delete S.checks[p][k][from]; } });
    addLog(p, `${student(id).name}: ${from} → ${to} 자리 이동`);
    S.profPick = to; toast(`${to}(으)로 옮겼습니다.`); return render();
  }
  if (act === "unassign") {
    const p = S.profPeriod, seat = S.profPick, id = S.res[p][seat];
    delete S.res[p][seat]; ROUNDS.forEach(([k]) => delete S.checks[p][k][seat]);
    addLog(p, `${seat} ${student(id).name}: 좌석 배정 해제`); S.profPick = null; return render();
  }
  if (act === "reset") {
    if (LIVE && !confirm(`${DAY} 모든 교시 기록을 예시 데이터로 덮어씁니다. 모든 기기에 반영됩니다. 계속할까요?`)) return;
    const keep = { role: S.role, demoReplies: S.demoReplies, students: S.students, secret: S.secret, staffList: S.staffList, submitted: S.submitted, sim: S.sim, simAt: S.simAt };
    S = seed(); Object.assign(S, keep);
    if (!LIVE) S.students = seedStudents();
    if (LIVE) writeAllPeriods();
    toast("예시 데이터로 채웠습니다."); return render();
  }
  if (act === "wipe" && LIVE) {
    if (!confirm(`${DAY} 모든 교시의 예약과 출석 기록을 지웁니다. 모든 기기에 반영됩니다. 계속할까요?`)) return;
    PERIODS.forEach(({ n }) => { applyPeriod(n, emptyPeriod()); S.res[n] = {}; });
    writeAllPeriods(); toast("오늘 데이터를 모두 비웠습니다."); return render();
  }
  if (act === "demoToggle" && LIVE) {
    FB.setDoc(FB.doc(FB.db, "config", "main"), { demoReplies: S.demoReplies === false }, { merge: true }).catch(syncErr);
    return;
  }
});

// 교수 출석 체크: 우클릭(휴대폰은 길게 누르기) = 빈자리
document.addEventListener("contextmenu", e => {
  const el = e.target.closest("[data-pseat]");
  if (!el || !S.quick || S.role !== "prof") return;
  const p = S.profPeriod, seat = el.dataset.pseat;
  if (!S.res[p][seat]) return;
  e.preventDefault();
  cycleCheck(p, seat, "out"); S.profPick = null; render();
});
document.addEventListener("submit", e => {
  if (e.target.id === "codeForm") {
    e.preventDefault();
    const p = +e.target.dataset.p, k = e.target.dataset.k, ss = sess(p, k), v = $("#codeIn").value.trim();
    if (!live(ss)) { toast("입력 시간이 지났습니다."); return render(); }
    if (LIVE) {
      // 정답 여부와 입력 시간은 보안 규칙이 서버에서 확인 (학생 기기는 코드를 모름)
      if (!/^\d{4}$/.test(v)) return toast("코드 4자리를 입력하세요.");
      FB.setDoc(FB.doc(FB.db, "days", DAY, "codes", p + "_" + k + "_" + S.me), { p, k, sid: S.me, code: v, at: FB.serverTimestamp() })
        .then(() => { S.submitted[p + "_" + k] = true; toast("코드를 제출했습니다."); render(); },
              err => toast(err.code === "permission-denied" ? "코드가 맞지 않거나 입력 시간이 지났습니다. 이미 제출했다면 다시 낼 필요가 없습니다." : "제출 실패: " + err.code));
      return;
    }
    if (v !== ss.code) return toast("코드가 맞지 않습니다. 강의실 화면을 다시 확인하세요.");
    markDone(p, k, ss, S.me);
    addLog(p, `${student(S.me).name}: ${roundName(k)} 출결 코드 입력`);
    toast(`${plabel(p)} ${roundName(k)} 출결이 확인되었습니다.`);
    return render();
  }
  const id = e.target.id;
  if (["staffLogin", "stuLogin", "stuSignup", "addStu", "addStaff"].includes(id)) e.preventDefault();
  if (id === "staffLogin") {
    FB.signInWithEmailAndPassword(FB.auth, $("#stEmail").value.trim(), $("#stPw").value).catch(authError);
    return;
  }
  if (id === "stuLogin" || id === "stuSignup") {
    const sid = $("#auSid").value.trim(), pw = $("#auPw").value;
    if (!/^\d{8}$/.test(sid)) return authError({ message: "학번 8자리를 숫자로 입력하세요." });
    if (id === "stuLogin") { curGen(sid).then(g => FB.signInWithEmailAndPassword(FB.auth, sidEmail(sid, g), pw)).catch(authError); return; }
    if (pw.length < 6) return authError({ code: "auth/weak-password" });
    if (pw !== $("#auPw2").value) return authError({ message: "비밀번호 확인이 일치하지 않습니다." });
    FB.getDoc(FB.doc(FB.db, "rosterIds", sid))
      .then(snap => snap.exists() ? curGen(sid).then(g => FB.createUserWithEmailAndPassword(FB.auth, sidEmail(sid, g), pw))
        : Promise.reject({ message: "명단에 없는 학번입니다. 학번을 확인하거나 교수님께 문의하세요." }))
      .then(() => { S.authMode = "login"; toast("가입했습니다."); })
      .catch(authError);
    return;
  }
  if (id === "addStu" && isStaffUser()) {
    const sid = $("#newSid").value.trim(), name = $("#newName").value.trim(), dept = $("#newDept").value.trim();
    if (!/^\d{8}$/.test(sid) || !name) return toast("학번 8자리와 이름을 입력하세요.");
    const b = FB.writeBatch(FB.db);
    b.set(FB.doc(FB.db, "roster", sid), { name, dept, consent: true });
    b.set(FB.doc(FB.db, "rosterIds", sid), {});
    b.commit().then(() => toast(`${name}(${sid}) 학생을 추가했습니다.`), syncErr);
    return;
  }
  if (id === "addStaff" && USER && USER.isAdmin) {
    const em = $("#newStaff").value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(em)) return toast("이메일을 확인하세요.");
    FB.setDoc(FB.doc(FB.db, "staff", em), { addedAt: FB.serverTimestamp() }).then(() => toast(`${em} 교수 계정을 등록했습니다.`), syncErr);
    return;
  }
  if (id !== "loginForm") return;
  e.preventDefault();
  const v = $("#sid").value.trim();
  const err = $("#loginErr");
  if (!/^\d{8}$/.test(v)) { err.textContent = "학번 8자리를 숫자로 입력하세요."; err.hidden = false; return; }
  if (!S.students.find(s => s.id === v)) { err.textContent = "등록된 명단에 없는 학번입니다. 학번을 확인하거나 교수님께 문의하세요."; err.hidden = false; return; }
  S.me = v; S.pick = null; render();
});
document.addEventListener("change", e => {
  if (e.target.id === "profPeriod") { S.profPeriod = +e.target.value; S.profPick = null; render(); }
  if (e.target.id === "adminPeriod") { S.adminPeriod = +e.target.value; render(); }
  if (e.target.id === "simTime") { setSim(e.target.value); S.pick = null; S.period = null; render(); }
});
// 실제 시각 사용 중이면 1분마다 예약 가능 상태를 갱신
// 시각이 흐르면 예약 가능 상태와 자동 출결을 갱신 (입력 중에는 건너뜀)
let lastMin = nowMin();
setInterval(() => {
  const m = nowMin();
  if (m === lastMin || document.querySelector("input:focus, select:focus")) return;
  lastMin = m; render();
}, 5000);
render();
// PWA: 오프라인용 서비스 워커 등록 (https 또는 localhost에서만 동작)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
